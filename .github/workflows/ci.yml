name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-php83-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-php83-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-ansi

      - name: Configure test application
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-ansi

      - name: Test backend
        run: php artisan test --no-ansi

      - name: Check PHP code style
        run: vendor/bin/pint --test

      - name: Analyze PHP types
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      # Wayfinder generates route types during the build.
      - name: Check frontend types
        run: npm run types:check

      - name: Check frontend code style
        run: npm run check
